<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Baza autobusów MPK i PKS Rzeszów">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Baza autobusów MPK i PKS Rzeszów</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <img id="logo" class="logo" src="logo.png" alt="Logo" onerror="this.remove()">
    <div>
      <h1>Baza autobusów</h1>
      <p>MPK i PKS Rzeszów</p>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Przewoźnik">
    <button class="tab active" role="tab" aria-selected="true" data-carrier="MPK">MPK</button>
    <button class="tab" role="tab" aria-selected="false" data-carrier="PKS">PKS</button>
  </div>

  <div class="search">
    <input id="numer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5"
           placeholder="Wpisz numer taborowy" autocomplete="off" aria-label="Numer taborowy">
    <button id="clear" class="clear" aria-label="Wyczyść" hidden>✕</button>
  </div>

  <section id="result" class="result" hidden aria-live="polite"></section>

  <p id="count" class="count"></p>
  <ul id="list" class="list"></ul>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
